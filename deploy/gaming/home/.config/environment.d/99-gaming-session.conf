# Gaming Mode session configuration. The CachyOS SteamOS-style session
# (gamescope-session.service et al.) runs under the systemd user manager,
# so environment.d applies to it.

# Pin Vulkan to the RX 9070 XT (1002:7550) — this machine has 3 AMD GPUs
# (9070 XT, 6800 XT for ROCm/VFIO workflows, Raphael iGPU). Matches the
# desktop default renderer, so it is a no-op outside Gaming Mode.
MESA_VK_DEVICE_SELECT=1002:7550
MESA_VK_DEVICE_SELECT_FORCE_DEFAULT_DEVICE=1

# /usr/lib/steamos/gamescope-session passes this as gamescope -O.
# Ultrawide only; the ViewSonic is forced off at the DRM level by the root
# helper before SDDM restarts so gamescope only sees the AW3423DWF.
# (No -W/-H flags in this session type: gamescope runs embedded at the
# output's native mode, 3440x1440@165. Steam UI handles mode switching.)
OUTPUT_CONNECTOR=DP-2

# Auxiliary monitor(s) to pre-disable via hyprctl before switching to Gaming
# Mode (read by switch-to-gaming, not by systemd — deckshift v0.1.11 pattern).
# This is only a graceful desktop-side pre-step. The real crash fix is the
# privileged DRM connector force-off in /usr/local/bin/gaming-session-switch,
# because hyprctl state does not survive the SDDM restart.
OUTPUT_CONNECTOR_TO_DISABLE=HDMI-A-1

# ChimeraOS/gamescope-session-plus refresh-rate contract, kept documented but
# disabled because the current CachyOS backend uses the AW3423DWF Lua known-
# display profile for Steam's per-game refresh dropdown.
#CUSTOM_REFRESH_RATES=60,100,120,144,165
