# Gaming sysctl tuning (arch-gaming-optimization Tier 1.3)
# Rollback: sudo rm /etc/sysctl.d/99-gaming.conf && sudo sysctl --system
#
# Note: vm.max_map_count is already set in 80-gamecompatibility.conf.
# Note: kernel.sched_migration_cost_ns from the original plan was dropped —
#       it is no longer a sysctl on modern kernels (moved to debugfs).

# Avoid swapping during gaming memory pressure (default 60). Swap is still
# available as a last resort; this only biases the kernel against it.
vm.swappiness = 10

# Smaller, earlier writeback bursts -> fewer IO-induced frame spikes.
# 5% / 2% of 64 GB is still 3.2 GB / 1.3 GB of dirty page headroom.
vm.dirty_ratio = 5
vm.dirty_background_ratio = 2

# Proton/Wine watch many files; double the current limit.
fs.inotify.max_user_watches = 1048576
