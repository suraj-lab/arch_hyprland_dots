# Lower minimum audio quantum for gaming latency (Tier 2.2)
# 256 samples @ 48 kHz = ~5.3 ms. Apps request their own quantum; this only
# lowers the floor, so desktop/idle behaviour is unchanged.
# Rollback: remove this file, then: systemctl --user restart pipewire pipewire-pulse
context.properties = {
    default.clock.min-quantum = 256
}
