# Replaces /usr/share/xdg-desktop-portal/hyprland-portals.conf (same default),
# adding the Secret portal (Flatpak apps' passwords) -> gnome-keyring.
# FileChooser/Settings already fall through to gtk via the default.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
