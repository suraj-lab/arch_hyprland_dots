# Night light schedule for hyprsunset (replaces `wlsunset -S 9:00 -s 19:30`).
# hyprsunset has its own hyprlang parser; it does not read Hyprland's Lua config.
# 4000 K matches wlsunset's default low temperature.

profile {
    time = 9:00
    identity = true
}

profile {
    time = 19:30
    temperature = 4000
}
