# hyprsunset config. No profiles: the night light schedule (temperature, from, to) lives
# in ~/.config/quickshell/settings.json ("nightLight"), set from the shell's Settings, and the
# shell applies it through `hyprctl hyprsunset` (DE-upgrade 6.5). Profiles here would fight
# that schedule. hyprsunset has its own hyprlang parser; it does not read Hyprland's Lua config.
