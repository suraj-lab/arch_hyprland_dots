################

monitor=DP-2, preferred, 1920x-400, 1,vrr,2, bitdepth, 10, cm, hdr, sdrbrightness, 1.0, sdrsaturation, 1.0
monitor=desc:ViewSonic Corporation VX2476 Series UPA213310203, 1920x1080@74, 0x0, 1
monitor=DP-4,disable
monitor=DP-5,disable

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = thunar


# Launch apps
exec-once = quickshell &
exec-once = awww-daemon
exec-once = spotify-launcher
exec-once = ~/.config/hypr/scripts/awww-random-DP2 ~/.config/hypr/wallpapers
exec-once = ~/.config/hypr/scripts/awww-random-HDMI1 ~/.config/hypr/wallpapers
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
exec-once = ~/.config/hypr/scripts/xdg-portal-hyprland 
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = wlsunset -S 9:00 -s 19:30
exec-once = mozillavpn activate &


# Default env vars
env = XCURSOR_SIZE,24
env = GTK_THEME,Adwaita:dark
env = WLR_DRM_NO_ATOMIC,1

# Experimental

# Input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    
    gaps_in=7
    gaps_out=11
    border_size=2
    layout = dwindle
    allow_tearing = true

}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = true
    }
    active_opacity = 1.0
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0
}

$interval=3
$curve=easeOut

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = default, 0, 1, 0, 1
    bezier = wind, 0.05, 0.69, 0.1, 1
    bezier = winIn, 0.1, 1.1, 0.1, 1
    bezier = winOut, 0.3, 1, 0, 1
    bezier = linear, 1, 1, 1, 1

    bezier = easeOut, 0.16, 1, 0.3, 1

    animation = windowsIn, 1, $interval, $curve, slide
    animation = windowsOut, 1, $interval, $curve, slide
    animation = windowsMove, 1, $interval, $curve, slide
    animation = border, 1, 10, default
    animation = fade, 1, 10, smoothIn
    animation = fadeDim, 1, 10, smoothIn
    animation = workspaces, 1, 6, $curve, slide

    animation = layers, 1, 6.9, $curve, slide
  # animation = layersIn, 1, 10, default, slide
  # animation = layersOut, 1, 10, default, slide


}
dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    new_status = master
}


misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(ghostty)$
}

# Mouse
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


# Multimedia
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# MainMod key
$mainMod = SUPER

# Screenshot
$screenshotarea = hyprctl keyword animation "fadeOut,0,0,default"; grimblast --notify copysave area; hyprctl keyword animation "fadeOut,1,4,default"
bind = CTRL SHIFT, S, exec, qs msg screenshot area
bind = , Print, exec, qs msg screenshot screen

# Keybinds
bind = $mainMod, return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, E, exec, thunar
bind = $mainMod, B, exec, firefox
bind = $mainMod, P, togglefloating,
bind = $mainMod, Space, exec, qs msg launcher toggle
bind = $mainMod, W, exec, qs msg overview toggle
bind = $mainMod, V, exec, killall wofi || cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = CTRL ALT, L, exec, hyprlock
bind = $mainMod SHIFT, W, exec, qs msg wallpicker toggle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 6, workspace, 1
bind = $mainMod, 7, workspace, 2
bind = $mainMod, 8, workspace, 3
bind = $mainMod, 9, workspace, 4
bind = $mainMod, 0, workspace, 5

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 6, movetoworkspace, 1
bind = $mainMod SHIFT, 7, movetoworkspace, 2
bind = $mainMod SHIFT, 8, movetoworkspace, 3
bind = $mainMod SHIFT, 9, movetoworkspace, 4
bind = $mainMod SHIFT, 0, movetoworkspace, 5

# Example special workspace (scratchpad)
bind = $mainMod SHIFT, N, togglespecialworkspace, magic
bind = ALT SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


#  Spotify window rules (0.54 syntax):
windowrule = workspace special:spotify silent, match:class Spotify
windowrule = float on, match:class Spotify
windowrule = size 75% 65%, match:class Spotify
windowrule = center on, match:class Spotify

#  Native scratchpad keybinds (replace pyprland ones):
bind = Alt, M, togglespecialworkspace, spotify
bind = Alt, Return, togglespecialworkspace, term

# Blur
layerrule = blur on, match:namespace quickshell
layerrule = blur_popups on, match:namespace quickshell
layerrule = ignore_alpha 0.3, match:namespace quickshell

# Overlay namespaces (no slide animation)
layerrule = animation none, match:namespace quickshell-launcher
layerrule = blur off, match:namespace quickshell-launcher
layerrule = animation none, match:namespace quickshell-wallpicker
layerrule = blur off, match:namespace quickshell-wallpicker
layerrule = animation none, match:namespace quickshell-session
layerrule = blur off, match:namespace quickshell-session
layerrule = animation none, match:namespace quickshell-screenshot
layerrule = blur off, match:namespace quickshell-screenshot
layerrule = animation none, match:namespace quickshell-overview
layerrule = blur on, match:namespace quickshell-overview
layerrule = blur_popups on, match:namespace quickshell-overview
layerrule = ignore_alpha 0.3, match:namespace quickshell-overview