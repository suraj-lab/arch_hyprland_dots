# Lock hooks only (DE-upgrade 2.7). No listeners: idle lock / screens-off / suspend timers
# live in the shell (quickshell/components/DesktopServices.qml), so there's one idle manager.
general {
    lock_cmd = pidof hyprlock || hyprlock                            # loginctl lock-session
    before_sleep_cmd = loginctl lock-session                         # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # wake screens without a second keypress
    inhibit_sleep = 3                                                # hold suspend until the lock screen is up
}
