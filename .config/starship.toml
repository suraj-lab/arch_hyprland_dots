# Clean Catppuccin-style Starship prompt

format = """
$os$username$hostname$directory$git_branch$git_status$cmd_duration
$character"""

palette = "catppuccin_mocha"
add_newline = true

[os]
disabled = false
style = "bold mauve"

[username]
show_always = false
style_user = "bold lavender"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold blue"
format = "on [$hostname]($style) "

[directory]
style = "bold sapphire"
read_only = " 󰌾"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 1000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
