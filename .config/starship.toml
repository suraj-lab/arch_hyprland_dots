# Vibrant Starship prompt for the Arch/Hyprland rice.
# Uses Nerd Font glyphs; MesloLGS NF is configured in Ghostty/Kitty.

add_newline = true
palette = "cyberpunk"

format = """
[╭─](bold surface)$os$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration
[╰─](bold surface)$character"""

[palettes.cyberpunk]
neon_pink = "#ff2e88"
neon_cyan = "#00e5ff"
neon_green = "#39ff14"
neon_yellow = "#fff700"
neon_purple = "#bd5eff"
surface = "#5b6078"
error_red = "#ff5555"

[os]
disabled = false
style = "bold neon_purple"
format = "[$symbol]($style) "

[os.symbols]
Arch = "󰣇"
Linux = "󰌽"
Macos = ""

[username]
show_always = false
style_user = "bold neon_cyan"
style_root = "bold error_red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold neon_yellow"
format = "[@$hostname]($style) "

[directory]
style = "bold neon_cyan"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold neon_pink"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold neon_yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "⚔"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[nodejs]
symbol = " "
style = "bold neon_green"
format = "via [$symbol($version)]($style) "

[python]
symbol = " "
style = "bold neon_yellow"
format = "via [${symbol}${pyenv_prefix}(${version})( \\($virtualenv\\))]($style) "

[rust]
symbol = "󱘗 "
style = "bold neon_pink"
format = "via [$symbol($version)]($style) "

[golang]
symbol = " "
style = "bold neon_cyan"
format = "via [$symbol($version)]($style) "

[cmd_duration]
min_time = 1000
style = "bold surface"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold neon_green)"
error_symbol = "[❯](bold error_red)"
vimcmd_symbol = "[❮](bold neon_yellow)"
